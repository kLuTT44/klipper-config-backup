[screws_tilt_adjust]

# Probe offset = -20.85 on the Y
screw1: 25,174.3
#   The (X, Y) coordinate of the first bed leveling screw. This is a
#   position to command the nozzle to so that the probe is directly
#   above the bed screw (or as close as possible while still being
#   above the bed). This is the base screw used in calculations. This
#   parameter must be provided.
screw1_name: BackRightScrew
#   An arbitrary name for the given screw. This name is displayed when
#   the helper script runs. The default is to use a name based upon
#   the screw XY location.

screw2: 25,83.3
screw2_name: MidRightScrew

screw3: 25,-5.7
screw3_name: FrontRightScrew

screw4: 83,-5.7
screw4_name: FrontMidRight

screw5: 83,83.3
screw5_name: MidMidRightScrew

screw6: 147,83.3
screw6_name: MidMidLeftScrew

screw7: 147,-5.7
screw7_name: FrontMidLeft


screw8: 205,-5.7
screw8_name: FrontLeftScrew

screw9: 205,83.3
screw9_name: MidLeftScrew

screw10: 205,174.3
screw10_name: BackLeftScrew









# screw1: 27.3,183.75
# #   The (X, Y) coordinate of the first bed leveling screw. This is a
# #   position to command the nozzle to so that the probe is directly
# #   above the bed screw (or as close as possible while still being
# #   above the bed). This is the base screw used in calculations. This
# #   parameter must be provided.
